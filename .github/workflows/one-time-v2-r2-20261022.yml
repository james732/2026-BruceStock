name: One-time v2-only r2 publication (2026-10-22)
# frozen-r1 retry
# official-env retry
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-v2-r2-20261022.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.event.head_commit.message == '[one-time] Dispatch 2026-10-22 v2-only r2 publication'
    runs-on: ubuntu-latest
    steps:
      - name: Publish official r2 and email
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run report.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f end_date=2026-10-22 -f send_email=true \
            -f publish_today=true -f reissue_report=true \
            -f recipient=bruce.sy.chen@gmail.com

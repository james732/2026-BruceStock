name: Generate stock report
on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Preview cutoff (YYYY-MM-DD); official sends must use the latest due date"
        required: false
        type: string
      send_email:
        description: "Publish and send latest due daily report (at most two automatic send attempts)"
        required: false
        type: boolean
        default: false
      publish_today:
        description: "Explicit early official release of today's dated report before 20:18 (requires send_email=true and end_date=today)"
        required: false
        type: boolean
        default: false
      reissue_report:
        description: "One-time audited r2 resend for today's already-issued official report (requires send_email and publish_today)"
        required: false
        type: boolean
        default: false
      recipient:
        description: "Recipient for an explicitly requested manual publication"
        required: false
        type: string
        default: "bruce.sy.chen@gmail.com"
  schedule:
    - cron: "18,38,58 12-15 * * *" # Taipei 20:18 through 23:58
    - cron: "18 16-23 * * *"       # Taipei 00:18 through 07:18
    - cron: "18 0-11 * * *"       # Taipei 08:18 through 19:18
permissions:
  contents: read
concurrency:
  group: stock-report
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      END_DATE: ${{ inputs.end_date }}
      SEND_EMAIL: ${{ inputs.send_email }}
      EARLY_PUBLISH: ${{ inputs.publish_today }}
      REISSUE_REPORT: ${{ inputs.reissue_report }}
      RECIPIENT: ${{ github.event_name == 'schedule' && 'bruce.sy.chen@gmail.com' || inputs.recipient || 'bruce.sy.chen@gmail.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Plan publication and restore frozen report
        id: plan
        run: uv run --frozen report_delivery.py prepare
      - name: Require Pages for official publication
        if: steps.plan.outputs.run == 'true' && steps.plan.outputs.official == 'true'
        env:
          PAGES_ENABLED: ${{ vars.PAGES_ENABLED }}
        run: test "$PAGES_ENABLED" = true
      - name: Restore market data cache
        if: steps.plan.outputs.generate == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/finmind.sqlite3
            tdcc_cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            market-data-${{ runner.os }}-
      - name: Generate reports with one batch date
        if: steps.plan.outputs.generate == 'true'
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          REPORT_DATE: ${{ steps.plan.outputs.report_date }}
          REPORT_MODE: ${{ steps.plan.outputs.mode }}
          OFFICIAL: ${{ steps.plan.outputs.official }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public
          if [ "$REISSUE_REPORT" = true ]; then
            # Only page presentation changed; reuse the verified, frozen r1 scores.
            uv run --frozen report_delivery.py reuse-r1
          else
            uv run --frozen momentum_report.py --end-date "$REPORT_DATE" --mode "$REPORT_MODE" --output public/analysis_momentum.html --metadata-output public/generation.json
            cp public/analysis_momentum.html public/index.html
          fi
          test -s public/index.html
          test -s public/analysis_momentum.html
          test -s public/generation.json
      - name: Freeze report and checkpoint before deployment
        if: steps.plan.outputs.generate == 'true'
        env:
          REPORT_DATE: ${{ steps.plan.outputs.report_date }}
          OFFICIAL: ${{ steps.plan.outputs.official }}
        run: uv run --frozen report_delivery.py freeze
      - name: Save updated market data cache
        if: steps.plan.outputs.generate == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/finmind.sqlite3
            tdcc_cache
          key: market-data-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save downloadable frozen reports
        if: steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-report-${{ steps.plan.outputs.report_date }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: public/
          retention-days: 30
          if-no-files-found: error
      - name: Package website
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/
      - name: Deploy frozen HTML
        id: deployment
        if: steps.plan.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
      - name: Checkpoint deployment
        if: steps.plan.outputs.deploy == 'true'
        env:
          REPORT_DATE: ${{ steps.plan.outputs.report_date }}
          OFFICIAL: ${{ steps.plan.outputs.official }}
        run: uv run --frozen report_delivery.py deployed
      - name: Send frozen v2 report with bounded retries
        if: steps.plan.outputs.send == 'true'
        env:
          REPORT_DATE: ${{ steps.plan.outputs.report_date }}
          OFFICIAL: ${{ steps.plan.outputs.official }}
          GMAIL_CLIENT_SECRET_JSON: ${{ secrets.GMAIL_CLIENT_SECRET_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: uv run --frozen report_delivery.py send
      - name: Flag exhausted delivery without claiming success
        if: steps.plan.outputs.delivery_blocked == 'true'
        env:
          REASON: ${{ steps.plan.outputs.reason }}
        run: echo "::warning title=Email delivery not confirmed::$REASON"
      - name: Publication summary
        if: always()
        env:
          REPORT_DATE: ${{ steps.plan.outputs.report_date }}
          OFFICIAL: ${{ steps.plan.outputs.official }}
          REASON: ${{ steps.plan.outputs.reason }}
          DELIVERY_BLOCKED: ${{ steps.plan.outputs.delivery_blocked }}
        shell: bash
        run: |
          {
            echo "### Stock report publication"
            echo "Batch: $REPORT_DATE; official: $OFFICIAL"
            echo "$REASON"
            if [ "$DELIVERY_BLOCKED" = true ]; then
              echo "**ACTION REQUIRED:** Email delivery remains unconfirmed after two recorded attempts; see failed runs and delivery.json."
            fi
            echo "Official snapshots and delivery attempts are checkpointed on report-state."
            echo "At most two automatic Gmail calls per report revision and recipient; successful delivery skips later runs."
            echo "Preview runs generate artifacts only. GitHub schedule timing is best effort."
          } >> "$GITHUB_STEP_SUMMARY"

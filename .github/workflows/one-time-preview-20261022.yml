name: One-time stock report preview (2026-10-22)
# Eligibility retry
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-preview-20261022.yml
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: github.event.head_commit.message == '[one-time] Dispatch Oct 22 stock preview'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing report generator in preview mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run report.yml --repo "$GITHUB_REPOSITORY" --ref main -f end_date=2026-10-22
